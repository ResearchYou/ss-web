name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Go backend ──────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Go build
        working-directory: server
        run: go build ./...

      - name: Go test
        working-directory: server
        run: go test ./... -v -coverprofile=coverage.out 2>&1 | tee test-results.txt

      - name: Upload Go test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-test-results-${{ matrix.os }}
          path: server/test-results.txt

      - name: Upload Go coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ matrix.os }}
          path: server/coverage.out

      # ── React/Vite frontend ─────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
          cache-dependency-path: client/yarn.lock

      - name: Install client dependencies
        working-directory: client
        run: yarn install --frozen-lockfile

      - name: Client lint
        working-directory: client
        run: yarn lint

      - name: Client build
        working-directory: client
        run: yarn build

      # ── Docker build (Ubuntu only) ──────────────────────
      - name: Docker build API image
        if: matrix.os == 'ubuntu-latest'
        working-directory: server
        run: docker build -t ss-web-api:test .
